server:
  port: 8087  #绔彛
  tomcat:
    uri-encoding: UTF-8   #鏈嶅姟缂栫爜
  error:
    include-message: always #杩斿洖鐨勫搷搴斾綋甯︿笂message
spring:
  profiles:
    active: dev
  application:
    name: rk-pay
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        file-extension: yaml
        shared-configs: # 鍏变韩閰嶇疆
          - dataId: rk-shared-spring.yaml # 鍏变韩spring閰嶇疆
          - dataId: rk-shared-redis.yaml # 鍏变韩redis閰嶇疆
          - dataId: rk-shared-mybatis.yaml # 鍏变韩mybatis閰嶇疆
          - dataId: rk-shared-logs.yaml # 鍏变韩鏃ュ織閰嶇疆
          - dataId: rk-shared-feign.yaml # 鍏变韩feign閰嶇疆
          - dataId: rk-shared-mq.yaml # 鍏变韩mq閰嶇疆
          - dataId: rk-shared-xxljob.yaml # 鍏变韩mq閰嶇疆
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.pay.controller
    title: 澶╂満瀛﹀爞 - 鏀粯涓績鎺ュ彛鏂囨。
    description: 璇ユ湇鍔℃彁渚涘井淇°€佹敮浠樺疂绛夊悇绉嶅钩鍙扮殑鏀粯銆侀€€娆剧瓑鍔熻兘
    contact-name: 浼犳櫤鏁欒偛路鐮旂┒闄?
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
  jdbc:
    database: rk_pay
  pay:
    notifyHost: "${PAY_NOTIFY_HOST:http://127.0.0.1:10010/ps}"
    ali:
      appId: "${ALIPAY_APP_ID:}"
      merchantPrivateKey: "${ALIPAY_MERCHANT_PRIVATE_KEY:}"
      publicKey: "${ALIPAY_PUBLIC_KEY:}"
    wx:
      appId: "${WECHAT_PAY_APP_ID:}"
      mchId: "${WECHAT_PAY_MCH_ID:}"
      mchSerialNo: "${WECHAT_PAY_MCH_SERIAL_NO:}"
      privateKey: "${WECHAT_PAY_PRIVATE_KEY:}"
      apiV3Key: "${WECHAT_PAY_API_V3_KEY:}"
server:
  port: 8086  #绔彛
  tomcat:
    uri-encoding: UTF-8   #鏈嶅姟缂栫爜
spring:
  profiles:
    active: dev
  application:
    name: rk-content
  main:
    allow-circular-references: true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        file-extension: yaml
        shared-configs: # 鍏变韩閰嶇疆
          - data-id: rk-shared-spring.yaml # 鍏变韩spring閰嶇疆
          - data-id: rk-shared-redis.yaml # 鍏变韩redis閰嶇疆
          - data-id: rk-shared-mybatis.yaml # 鍏变韩mybatis閰嶇疆
          - data-id: rk-shared-logs.yaml # 鍏变韩鏃ュ織閰嶇疆
          - data-id: rk-shared-feign.yaml # 鍏变韩feign閰嶇疆
          - data-id: rk-shared-mq.yaml # 鍏变韩MQ閰嶇疆
          - data-id: rk-shared-seata.yaml # 鍏变韩seata閰嶇疆
          - data-id: rk-shared-xxljob.yaml # 鍏变韩seata閰嶇疆
          - data-id: rk-shared-minio.yaml # 鍏变韩minio閰嶇疆
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
